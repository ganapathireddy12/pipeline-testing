<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ganapathi | SRE Bug Blaster</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-wrapper">
      <!-- HUD Bar -->
      <div class="hud">
        <div class="hud-item">
          <span class="label">PILOT</span>
          <span class="value cyan">GANAPATHI</span>
        </div>
        <div class="hud-item">
          <span class="label">SCORE</span>
          <span class="value" id="scoreVal">0000</span>
        </div>
        <div class="hud-item">
          <span class="label">SHIELDS</span>
          <span class="value green" id="shieldVal">100%</span>
        </div>
        <div class="hud-item">
          <span class="label">ACTIVE BOOSTER</span>
          <span class="value yellow" id="boosterVal">NONE</span>
        </div>
        <div class="hud-item">
          <span class="label">SYSTEM</span>
          <span class="value status-badge" id="sysStatus">ONLINE</span>
        </div>
      </div>

      <!-- Canvas Arcade View -->
      <canvas id="gameCanvas" width="800" height="500"></canvas>

      <!-- Overlay (Game Start / Over) -->
      <div class="overlay" id="gameOverlay">
        <h1 class="title">SRE BUG DEFENDER</h1>
        <p class="subtitle">Collect drops: <strong>Triple Shot [3X]</strong>, <strong>Shield Restore [SHIELD]</strong> & <strong>EMP Nuke [EMP]</strong></p>
        <p class="controls-hint">
          <i class="fas fa-arrows-left-right"></i> Move: <strong>Mouse / Touch</strong> &nbsp;|&nbsp; 
          <i class="fas fa-crosshairs"></i> Shoot: <strong>Click / Spacebar</strong>
        </p>
        <button class="btn-play" onclick="startGame()">
          <i class="fas fa-play"></i> LAUNCH MISSION
        </button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      let gameRunning = false;
      let score = 0;
      let shield = 100;
      let playerX = canvas.width / 2;
      let lasers = [];
      let enemies = [];
      let particles = [];
      let powerups = [];
      let spawnTimer = 0;

      // Booster state
      let tripleShotTimer = 0;

      // Controls
      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        playerX = Math.max(25, Math.min(canvas.width - 25, e.clientX - rect.left));
      });

      canvas.addEventListener("mousedown", shoot);
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          shoot();
          e.preventDefault();
        }
      });

      function shoot() {
        if (!gameRunning) return;
        if (tripleShotTimer > 0) {
          // Triple Shot Booster
          lasers.push({ x: playerX - 18, y: canvas.height - 45, vx: -1.5 });
          lasers.push({ x: playerX, y: canvas.height - 50, vx: 0 });
          lasers.push({ x: playerX + 18, y: canvas.height - 45, vx: 1.5 });
        } else {
          // Standard Dual Laser
          lasers.push({ x: playerX - 12, y: canvas.height - 45, vx: 0 });
          lasers.push({ x: playerX + 12, y: canvas.height - 45, vx: 0 });
        }
      }

      function startGame() {
        document.getElementById("gameOverlay").style.display = "none";
        document.getElementById("sysStatus").innerText = "COMBAT ACTIVE";
        document.getElementById("sysStatus").className = "value status-badge active";
        score = 0;
        shield = 100;
        tripleShotTimer = 0;
        lasers = [];
        enemies = [];
        particles = [];
        powerups = [];
        gameRunning = true;
        updateHud();
        requestAnimationFrame(gameLoop);
      }

      function updateHud() {
        document.getElementById("scoreVal").innerText = score.toString().padStart(4, "0");
        const sVal = document.getElementById("shieldVal");
        sVal.innerText = `${shield}%`;
        if (shield <= 30) sVal.className = "value red";
        else if (shield <= 60) sVal.className = "value yellow";
        else sVal.className = "value green";

        const bVal = document.getElementById("boosterVal");
        if (tripleShotTimer > 0) {
          bVal.innerText = `TRIPLE SHOT (${Math.ceil(tripleShotTimer / 60)}s)`;
          bVal.className = "value cyan";
        } else {
          bVal.innerText = "NONE";
          bVal.className = "value yellow";
        }
      }

      function gameOver() {
        gameRunning = false;
        const overlay = document.getElementById("gameOverlay");
        overlay.style.display = "flex";
        overlay.querySelector(".title").innerText = "CRITICAL OUTAGE";
        overlay.querySelector(".subtitle").innerHTML = `Cluster overloaded! Final Score: <strong>${score}</strong>`;
        overlay.querySelector(".btn-play").innerHTML = `<i class="fas fa-rotate-right"></i> RE-DEPLOY CLUSTER`;
        document.getElementById("sysStatus").innerText = "OFFLINE";
        document.getElementById("sysStatus").className = "value status-badge offline";
      }

      function createExplosion(x, y, color, count = 16) {
        for (let i = 0; i < count; i++) {
          particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 7,
            vy: (Math.random() - 0.5) * 7,
            life: 25,
            color
          });
        }
      }

      function triggerNuke() {
        createExplosion(canvas.width / 2, canvas.height / 2, "#00f2fe", 80);
        enemies.forEach(en => {
          createExplosion(en.x, en.y, en.color);
          score += 50;
        });
        enemies = [];
        updateHud();
      }

      function gameLoop() {
        if (!gameRunning) return;

        // Background Motion
        ctx.fillStyle = "rgba(4, 7, 15, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Player Ship Render
        ctx.save();
        ctx.translate(playerX, canvas.height - 35);
        ctx.shadowBlur = tripleShotTimer > 0 ? 25 : 15;
        ctx.shadowColor = tripleShotTimer > 0 ? "#ff00ea" : "#00f2fe";
        ctx.fillStyle = tripleShotTimer > 0 ? "#ff00ea" : "#00f2fe";
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(-20, 15);
        ctx.lineTo(0, 5);
        ctx.lineTo(20, 15);
        ctx.closePath();
        ctx.fill();

        // Booster active aura ring
        if (tripleShotTimer > 0) {
          ctx.strokeStyle = "rgba(255, 0, 234, 0.6)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 28, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Engine flame
        ctx.fillStyle = "#ff0077";
        ctx.beginPath();
        ctx.moveTo(-6, 8);
        ctx.lineTo(0, 18 + Math.random() * 8);
        ctx.lineTo(6, 8);
        ctx.fill();
        ctx.restore();

        // Triple shot countdown
        if (tripleShotTimer > 0) {
          tripleShotTimer--;
          if (tripleShotTimer % 30 === 0) updateHud();
        }

        // Lasers Update
        for (let i = lasers.length - 1; i >= 0; i--) {
          const l = lasers[i];
          l.y -= 10;
          l.x += l.vx || 0;
          ctx.shadowBlur = 10;
          ctx.shadowColor = tripleShotTimer > 0 ? "#ff00ea" : "#00ff87";
          ctx.fillStyle = tripleShotTimer > 0 ? "#ff00ea" : "#00ff87";
          ctx.fillRect(l.x - 2, l.y, 4, 14);

          if (l.y < 0 || l.x < 0 || l.x > canvas.width) lasers.splice(i, 1);
        }

        // Spawn Enemies
        spawnTimer++;
        if (spawnTimer % 38 === 0) {
          const types = [
            { text: "500 ERROR", color: "#ff3366", hp: 1, speed: 2.2 },
            { text: "MEMORY LEAK", color: "#ffbd2e", hp: 2, speed: 1.7 },
            { text: "LATENCY SPIKE", color: "#bd00ff", hp: 1, speed: 2.8 }
          ];
          const chosen = types[Math.floor(Math.random() * types.length)];
          enemies.push({
            x: Math.random() * (canvas.width - 120) + 60,
            y: -20,
            ...chosen
          });
        }

        // Enemies Loop
        for (let i = enemies.length - 1; i >= 0; i--) {
          const en = enemies[i];
          en.y += en.speed;

          ctx.shadowBlur = 12;
          ctx.shadowColor = en.color;
          ctx.fillStyle = "rgba(10, 15, 30, 0.9)";
          ctx.strokeStyle = en.color;
          ctx.lineWidth = 1.5;
          ctx.strokeRect(en.x - 45, en.y - 12, 90, 24);
          ctx.fillRect(en.x - 45, en.y - 12, 90, 24);

          ctx.font = "bold 9px 'JetBrains Mono', monospace";
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.fillText(en.text, en.x, en.y + 4);

          // Check laser collisions
          for (let j = lasers.length - 1; j >= 0; j--) {
            const l = lasers[j];
            if (l.x > en.x - 45 && l.x < en.x + 45 && l.y > en.y - 12 && l.y < en.y + 12) {
              en.hp--;
              lasers.splice(j, 1);
              createExplosion(l.x, l.y, en.color, 8);

              if (en.hp <= 0) {
                createExplosion(en.x, en.y, en.color, 16);

                // 25% Chance to drop a booster capsule
                if (Math.random() < 0.25) {
                  const bTypes = [
                    { type: "TRIPLE", label: "3X", color: "#ff00ea" },
                    { type: "SHIELD", label: "+50%", color: "#00ff87" },
                    { type: "NUKE", label: "EMP", color: "#00f2fe" }
                  ];
                  const b = bTypes[Math.floor(Math.random() * bTypes.length)];
                  powerups.push({ x: en.x, y: en.y, ...b });
                }

                enemies.splice(i, 1);
                score += 50;
                updateHud();
                break;
              }
            }
          }

          // Screen Bottom Breach
          if (en && en.y > canvas.height - 10) {
            shield = Math.max(0, shield - 20);
            createExplosion(en.x, canvas.height - 10, "#ff0044");
            enemies.splice(i, 1);
            updateHud();
            if (shield <= 0) {
              gameOver();
              return;
            }
          }
        }

        // Powerups / Boosters Fall & Collect
        for (let i = powerups.length - 1; i >= 0; i--) {
          const p = powerups[i];
          p.y += 2.0;

          // Capsule visual
          ctx.save();
          ctx.shadowBlur = 15;
          ctx.shadowColor = p.color;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
          ctx.fill();

          ctx.font = "bold 9px 'Orbitron', sans-serif";
          ctx.fillStyle = "#03060c";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(p.label, p.x, p.y);
          ctx.restore();

          // Player pickup hit check
          const dist = Math.hypot(p.x - playerX, p.y - (canvas.height - 35));
          if (dist < 32) {
            if (p.type === "TRIPLE") {
              tripleShotTimer = 480; // ~8 seconds
            } else if (p.type === "SHIELD") {
              shield = Math.min(100, shield + 50);
            } else if (p.type === "NUKE") {
              triggerNuke();
            }
            createExplosion(p.x, p.y, p.color, 20);
            powerups.splice(i, 1);
            updateHud();
            continue;
          }

          if (p.y > canvas.height) powerups.splice(i, 1);
        }

        // Particle FX
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.life--;
          ctx.shadowBlur = 6;
          ctx.shadowColor = pt.color;
          ctx.fillStyle = pt.color;
          ctx.fillRect(pt.x, pt.y, 3, 3);
          if (pt.life <= 0) particles.splice(i, 1);
        }

        requestAnimationFrame(gameLoop);
      }
    </script>
  </body>
</html>
