<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ganapathi | Cyber Synthwave Runner</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Fullscreen Canvas -->
    <canvas id="runnerCanvas"></canvas>

    <!-- Top Neon HUD -->
    <div class="hud-layer">
      <div class="hud-box">
        <span class="hud-tag">OPERATOR</span>
        <span class="hud-val cyan">GANAPATHI</span>
      </div>
      <div class="hud-box">
        <span class="hud-tag">SCORE</span>
        <span class="hud-val" id="scoreEl">00000</span>
      </div>
      <div class="hud-box">
        <span class="hud-tag">SPEED WARP</span>
        <span class="hud-val yellow" id="speedEl">1.0x</span>
      </div>
      <div class="hud-box">
        <span class="hud-tag">MULTIPLIER</span>
        <span class="hud-val pink" id="comboEl">x1</span>
      </div>
      <div class="hud-box">
        <span class="hud-tag">STATUS</span>
        <span class="hud-val green" id="statusEl">OPTIMAL</span>
      </div>
    </div>

    <!-- Interactive Start / Game Over Modal -->
    <div class="screen-modal" id="gameModal">
      <div class="modal-card">
        <div class="scanner-line"></div>
        <h1 class="glitch-title">CYBER RUNNER // 2077</h1>
        <p class="modal-desc">
          Shift between lanes, dodge firewall nodes, and grab quantum data packets.
        </p>

        <div class="key-guide">
          <div class="key-item"><kbd>A</kbd> / <kbd>←</kbd> <span>Left</span></div>
          <div class="key-item"><kbd>D</kbd> / <kbd>→</kbd> <span>Right</span></div>
          <div class="key-item"><kbd>W</kbd> / <kbd>↑</kbd> / <kbd>Space</kbd> <span>Jump</span></div>
        </div>

        <button class="launch-btn" onclick="startRunner()">
          <i class="fas fa-play"></i> ENGAGE ENGINE
        </button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("runnerCanvas");
      const ctx = canvas.getContext("2d");

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      resize();

      // State variables
      let running = false;
      let score = 0;
      let speed = 7;
      let combo = 1;
      let comboCount = 0;
      let laneIndex = 1; // 0: Left, 1: Center, 2: Right
      let playerZ = 0; // Jump offset
      let playerVZ = 0;
      let isJumping = false;

      let obstacles = [];
      let orbs = [];
      let roadOffset = 0;
      let stars = [];

      // Generate Background Starfield
      for (let i = 0; i < 90; i++) {
        stars.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * (window.innerHeight * 0.5),
          size: Math.random() * 2,
          alpha: Math.random()
        });
      }

      function getLaneX(lane, progressY) {
        const horizonX = canvas.width / 2;
        const horizonY = canvas.height * 0.42;
        const bottomY = canvas.height;
        const t = (progressY - horizonY) / (bottomY - horizonY);

        const bottomWidth = Math.min(canvas.width * 0.85, 950);
        const topWidth = 40;
        const currentWidth = topWidth + (bottomWidth - topWidth) * t;

        const leftEdge = horizonX - currentWidth / 2;
        const laneWidth = currentWidth / 3;
        return leftEdge + laneWidth * lane + laneWidth / 2;
      }

      // Input handlers
      window.addEventListener("keydown", (e) => {
        if (!running) return;
        if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && laneIndex > 0) {
          laneIndex--;
        } else if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && laneIndex < 2) {
          laneIndex++;
        } else if ((e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.key === " ") && !isJumping) {
          isJumping = true;
          playerVZ = 13;
          e.preventDefault();
        }
      });

      function startRunner() {
        document.getElementById("gameModal").style.display = "none";
        document.getElementById("statusEl").innerText = "IN-RUN";
        document.getElementById("statusEl").className = "hud-val green";
        running = true;
        score = 0;
        speed = 8;
        combo = 1;
        comboCount = 0;
        laneIndex = 1;
        obstacles = [];
        orbs = [];
        updateHUD();
        requestAnimationFrame(loop);
      }

      function gameOver() {
        running = false;
        const modal = document.getElementById("gameModal");
        modal.style.display = "flex";
        modal.querySelector(".glitch-title").innerText = "SYSTEM CRASHED";
        modal.querySelector(".modal-desc").innerHTML = `Telemetry terminated. Distance Cleared: <strong>${Math.floor(score)}</strong> pts`;
        modal.querySelector(".launch-btn").innerHTML = `<i class="fas fa-rotate-right"></i> REBOOT RUN`;
        document.getElementById("statusEl").innerText = "BREACHED";
        document.getElementById("statusEl").className = "hud-val red";
      }

      function updateHUD() {
        document.getElementById("scoreEl").innerText = Math.floor(score).toString().padStart(5, "0");
        document.getElementById("speedEl").innerText = (speed / 7).toFixed(1) + "x";
        document.getElementById("comboEl").innerText = `x${combo}`;
      }

      function spawnTrackEntities() {
        const horizonY = canvas.height * 0.42;

        // Obstacles
        if (Math.random() < 0.035) {
          obstacles.push({
            lane: Math.floor(Math.random() * 3),
            y: horizonY + 5,
            type: Math.random() > 0.4 ? "BLOCK" : "DRONE"
          });
        }

        // Data Orbs
        if (Math.random() < 0.05) {
          orbs.push({
            lane: Math.floor(Math.random() * 3),
            y: horizonY + 5
          });
        }
      }

      function loop() {
        if (!running) return;

        score += (speed / 10) * combo;
        speed = Math.min(18, speed + 0.0015);
        if (score % 20 < 1) updateHUD();

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Synthwave Background Grid & Sun
        const horizonY = canvas.height * 0.42;
        const horizonX = canvas.width / 2;

        // Sky gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
        skyGrad.addColorStop(0, "#05020a");
        skyGrad.addColorStop(0.7, "#1a082d");
        skyGrad.addColorStop(1, "#360e4b");
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, horizonY);

        // Stars
        ctx.fillStyle = "#fff";
        stars.forEach(st => {
          ctx.globalAlpha = st.alpha;
          ctx.fillRect(st.x, st.y, st.size, st.size);
        });
        ctx.globalAlpha = 1;

        // Synthwave Sun
        ctx.save();
        const sunRadius = 70;
        const sunGrad = ctx.createLinearGradient(0, horizonY - sunRadius * 2, 0, horizonY);
        sunGrad.addColorStop(0, "#ff007f");
        sunGrad.addColorStop(0.8, "#ffe600");
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(horizonX, horizonY - 15, sunRadius, Math.PI, 0, false);
        ctx.fill();
        ctx.restore();

        // Ground Floor
        const groundGrad = ctx.createLinearGradient(0, horizonY, 0, canvas.height);
        groundGrad.addColorStop(0, "#080614");
        groundGrad.addColorStop(1, "#020108");
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

        // 3D Perspective Grid Highway
        roadOffset = (roadOffset + speed * 1.4) % 60;
        const bottomWidth = Math.min(canvas.width * 0.85, 950);
        const topWidth = 40;

        ctx.strokeStyle = "rgba(0, 242, 254, 0.4)";
        ctx.lineWidth = 1.5;

        // Highway side borders
        ctx.beginPath();
        ctx.moveTo(horizonX - topWidth / 2, horizonY);
        ctx.lineTo(horizonX - bottomWidth / 2, canvas.height);
        ctx.moveTo(horizonX + topWidth / 2, horizonY);
        ctx.lineTo(horizonX + bottomWidth / 2, canvas.height);
        ctx.stroke();

        // 4 Lane Separators
        for (let i = 1; i <= 2; i++) {
          const tTop = i / 3;
          ctx.beginPath();
          ctx.moveTo(horizonX - topWidth / 2 + topWidth * tTop, horizonY);
          ctx.lineTo(horizonX - bottomWidth / 2 + bottomWidth * tTop, canvas.height);
          ctx.strokeStyle = "rgba(255, 0, 200, 0.25)";
          ctx.stroke();
        }

        // Horizontal Grid Movement
        for (let y = horizonY; y < canvas.height; y += 8) {
          const norm = (y - horizonY) / (canvas.height - horizonY);
          const drawY = horizonY + Math.pow(norm, 2.3) * (canvas.height - horizonY) + (roadOffset * norm * 0.2);
          if (drawY <= canvas.height) {
            ctx.beginPath();
            ctx.moveTo(0, drawY);
            ctx.lineTo(canvas.width, drawY);
            ctx.strokeStyle = `rgba(0, 242, 254, ${0.03 + norm * 0.25})`;
            ctx.stroke();
          }
        }

        spawnTrackEntities();

        // Update & Render Data Orbs
        for (let i = orbs.length - 1; i >= 0; i--) {
          const orb = orbs[i];
          orb.y += speed * 0.85;
          const x = getLaneX(orb.lane, orb.y);
          const scale = (orb.y - horizonY) / (canvas.height - horizonY);

          if (scale > 0.05) {
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#00ff87";
            ctx.fillStyle = "#00ff87";
            ctx.beginPath();
            ctx.arc(x, orb.y, Math.max(3, 13 * scale), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // Pickup check
          if (orb.y > canvas.height - 80 && orb.y < canvas.height - 10) {
            if (orb.lane === laneIndex) {
              score += 200;
              comboCount++;
              if (comboCount % 5 === 0) combo = Math.min(5, combo + 1);
              updateHUD();
              orbs.splice(i, 1);
              continue;
            }
          }
          if (orb.y > canvas.height + 30) orbs.splice(i, 1);
        }

        // Update & Render Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.y += speed * 0.85;
          const x = getLaneX(obs.lane, obs.y);
          const scale = (obs.y - horizonY) / (canvas.height - horizonY);

          if (scale > 0.05) {
            const width = Math.max(10, 60 * scale);
            const height = Math.max(8, 45 * scale);

            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff0055";
            ctx.fillStyle = "rgba(255, 0, 85, 0.85)";
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2 * scale;
            ctx.fillRect(x - width / 2, obs.y - height, width, height);
            ctx.strokeRect(x - width / 2, obs.y - height, width, height);
            ctx.restore();
          }

          // Collision Check
          if (obs.y > canvas.height - 75 && obs.y < canvas.height - 20) {
            if (obs.lane === laneIndex && playerZ < 22) {
              gameOver();
              return;
            }
          }
          if (obs.y > canvas.height + 40) obstacles.splice(i, 1);
        }

        // Player Jump Physics
        if (isJumping) {
          playerZ += playerVZ;
          playerVZ -= 0.8;
          if (playerZ <= 0) {
            playerZ = 0;
            playerVZ = 0;
            isJumping = false;
          }
        }

        // Render Player Hovercraft
        const playerY = canvas.height - 50 - playerZ;
        const playerX = getLaneX(laneIndex, canvas.height - 50);

        ctx.save();
        ctx.translate(playerX, playerY);

        // Shadow below hovercraft
        ctx.fillStyle = "rgba(0, 242, 254, 0.25)";
        ctx.beginPath();
        ctx.ellipse(0, 35 + playerZ, 30, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Neon craft body
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#00f2fe";
        ctx.fillStyle = "#00f2fe";
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(-24, 18);
        ctx.lineTo(0, 10);
        ctx.lineTo(24, 18);
        ctx.closePath();
        ctx.fill();

        // Jet booster trail
        ctx.fillStyle = "#ff007f";
        ctx.beginPath();
        ctx.moveTo(-8, 12);
        ctx.lineTo(0, 26 + Math.random() * 8);
        ctx.lineTo(8, 12);
        ctx.fill();

        ctx.restore();

        requestAnimationFrame(loop);
      }
    </script>
  </body>
</html>
